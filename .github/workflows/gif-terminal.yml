name: Generate Terminal GIF

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "gif-terminal/**"
      - ".github/workflows/gif-terminal.yml"

permissions:
  contents: write

jobs:
  generate-gif:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install dependencies
        run: pip install github-readme-terminal requests python-dotenv Pillow

      - name: Generate macOS terminal GIF
        working-directory: gif-terminal
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY_OWNER: ${{ github.repository_owner }}
          GIT_USERNAME: ${{ github.repository_owner }}
        run: python3 generate_liquid_glass.py

      - name: Commit GIF
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add gif-terminal/output.gif
          if git diff --cached --quiet; then
            echo "No GIF changes"
            exit 0
          fi
          git commit -m "Update terminal GIF [skip ci]"
          git pull --rebase origin main
          git push
