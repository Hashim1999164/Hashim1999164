<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 240" width="840" height="240" role="img" aria-label="AirDrop radar">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a84ff" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#5e5ce6" stop-opacity="0.12"/>
    </linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="840" height="240" rx="28" fill="#070b14"/>
  <rect x="1" y="1" width="838" height="238" rx="27" fill="none" stroke="#1c2436" stroke-width="1"/>
  
  <text x="36" y="48" font-family="SF Pro Display, Helvetica Neue, Arial" font-size="22" font-weight="700" fill="#f5f8ff">AirDrop radar</text>
  <text x="36" y="74" font-family="SF Pro Text, Helvetica Neue, Arial" font-size="13" fill="#8ea0b8">Nearby device discovery, concentric pulses</text>

  <g transform="translate(680,128)">
    <circle r="8" fill="#0a84ff"/>
    <circle r="28" fill="none" stroke="#0a84ff" stroke-width="2" opacity="0.9">
      <animate attributeName="r" values="16;88" dur="2.4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.8;0" dur="2.4s" repeatCount="indefinite"/>
    </circle>
    <circle r="28" fill="none" stroke="#5e5ce6" stroke-width="2" opacity="0.7">
      <animate attributeName="r" values="16;88" dur="2.4s" begin="0.8s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.7;0" dur="2.4s" begin="0.8s" repeatCount="indefinite"/>
    </circle>
    <circle r="28" fill="none" stroke="#f5f8ff" stroke-width="1.5" opacity="0.5">
      <animate attributeName="r" values="16;88" dur="2.4s" begin="1.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;0" dur="2.4s" begin="1.6s" repeatCount="indefinite"/>
    </circle>
  </g>

</svg>
