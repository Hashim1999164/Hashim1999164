<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 240" width="840" height="240" role="img" aria-label="Camera Control">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a84ff" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#5e5ce6" stop-opacity="0.12"/>
    </linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="840" height="240" rx="28" fill="#070b14"/>
  <rect x="1" y="1" width="838" height="238" rx="27" fill="none" stroke="#1c2436" stroke-width="1"/>
  
  <text x="36" y="48" font-family="SF Pro Display, Helvetica Neue, Arial" font-size="22" font-weight="700" fill="#f5f8ff">Camera Control</text>
  <text x="36" y="74" font-family="SF Pro Text, Helvetica Neue, Arial" font-size="13" fill="#8ea0b8">Capacitive shutter on the side</text>

  <rect x="620" y="60" width="120" height="150" rx="28" fill="#101826" stroke="#1c2436"/>
  <circle cx="680" cy="128" r="28" fill="none" stroke="#f5f8ff" stroke-width="3"/>
  <circle cx="680" cy="128" r="18" fill="#0a84ff">
    <animate attributeName="r" values="14;18;14" dur="1.8s" repeatCount="indefinite"/>
  </circle>
  <rect x="732" y="110" width="16" height="36" rx="6" fill="#8ea0b8"/>

</svg>
