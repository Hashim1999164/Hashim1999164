<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 240" width="840" height="240" role="img" aria-label="Activity rings">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a84ff" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#5e5ce6" stop-opacity="0.12"/>
    </linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="840" height="240" rx="28" fill="#070b14"/>
  <rect x="1" y="1" width="838" height="238" rx="27" fill="none" stroke="#1c2436" stroke-width="1"/>
  
  <text x="36" y="48" font-family="SF Pro Display, Helvetica Neue, Arial" font-size="22" font-weight="700" fill="#f5f8ff">Activity rings</text>
  <text x="36" y="74" font-family="SF Pro Text, Helvetica Neue, Arial" font-size="13" fill="#8ea0b8">Move, Exercise, Stand. Same HUD language as Watch.</text>

  <g transform="translate(620,120)">
    <circle r="78" fill="none" stroke="#3a1218" stroke-width="12"/>
    <circle r="78" fill="none" stroke="#ff375f" stroke-width="12" stroke-dasharray="390" stroke-dashoffset="90" stroke-linecap="round">
      <animate attributeName="stroke-dashoffset" values="390;90;90" dur="4s" repeatCount="indefinite"/>
    </circle>
    <circle r="58" fill="none" stroke="#14321c" stroke-width="12"/>
    <circle r="58" fill="none" stroke="#30d158" stroke-width="12" stroke-dasharray="290" stroke-dashoffset="70" stroke-linecap="round">
      <animate attributeName="stroke-dashoffset" values="290;70;70" dur="4s" repeatCount="indefinite"/>
    </circle>
    <circle r="38" fill="none" stroke="#2a2208" stroke-width="12"/>
    <circle r="38" fill="none" stroke="#ffd60a" stroke-width="12" stroke-dasharray="190" stroke-dashoffset="40" stroke-linecap="round">
      <animate attributeName="stroke-dashoffset" values="190;40;40" dur="4s" repeatCount="indefinite"/>
    </circle>
  </g>

</svg>
