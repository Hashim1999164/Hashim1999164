<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 240" width="840" height="240" role="img" aria-label="HomeKit">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a84ff" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#5e5ce6" stop-opacity="0.12"/>
    </linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="840" height="240" rx="28" fill="#070b14"/>
  <rect x="1" y="1" width="838" height="238" rx="27" fill="none" stroke="#1c2436" stroke-width="1"/>
  
  <text x="36" y="48" font-family="SF Pro Display, Helvetica Neue, Arial" font-size="22" font-weight="700" fill="#f5f8ff">HomeKit</text>
  <text x="36" y="74" font-family="SF Pro Text, Helvetica Neue, Arial" font-size="13" fill="#8ea0b8">Home hub tiles. Lights, lock, climate.</text>

  <g font-family="SF Pro Text, Arial" font-size="12" fill="#f5f8ff">
    <rect x="560" y="96" width="70" height="70" rx="16" fill="#152033"/>
    <rect x="644" y="96" width="70" height="70" rx="16" fill="#1a2740"/>
    <rect x="728" y="96" width="70" height="70" rx="16" fill="#152033"/>
    <text x="595" y="136" text-anchor="middle">Light</text>
    <text x="679" y="136" text-anchor="middle">Lock</text>
    <text x="763" y="136" text-anchor="middle">Temp</text>
    <circle cx="595" cy="150" r="4" fill="#ffd60a">
      <animate attributeName="opacity" values="0.3;1;0.3" dur="2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="679" cy="150" r="4" fill="#30d158"/>
    <circle cx="763" cy="150" r="4" fill="#0a84ff"/>
  </g>

</svg>
