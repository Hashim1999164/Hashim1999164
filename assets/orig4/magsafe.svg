<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 240" width="840" height="240" role="img" aria-label="MagSafe charging">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a84ff" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#5e5ce6" stop-opacity="0.12"/>
    </linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="840" height="240" rx="28" fill="#070b14"/>
  <rect x="1" y="1" width="838" height="238" rx="27" fill="none" stroke="#1c2436" stroke-width="1"/>
  
  <text x="36" y="48" font-family="SF Pro Display, Helvetica Neue, Arial" font-size="22" font-weight="700" fill="#f5f8ff">MagSafe</text>
  <text x="36" y="74" font-family="SF Pro Text, Helvetica Neue, Arial" font-size="13" fill="#8ea0b8">Snap to charge. Concentric magnet rings.</text>

  <g transform="translate(680,128)">
    <circle r="70" fill="none" stroke="#1c2436" stroke-width="10"/>
    <circle r="48" fill="none" stroke="#0a84ff" stroke-width="8"/>
    <circle r="26" fill="none" stroke="#f5f8ff" stroke-width="4"/>
    <circle r="8" fill="#0a84ff">
      <animate attributeName="opacity" values="0.4;1;0.4" dur="1.6s" repeatCount="indefinite"/>
    </circle>
  </g>
  <text x="680" y="214" text-anchor="middle" font-family="SF Pro Text, Arial" font-size="12" fill="#30d158">Charging 80%</text>

</svg>
