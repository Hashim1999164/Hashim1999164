<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 240" width="840" height="240" role="img" aria-label="visionOS spatial HUD">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a84ff" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#5e5ce6" stop-opacity="0.12"/>
    </linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="840" height="240" rx="28" fill="#070b14"/>
  <rect x="1" y="1" width="838" height="238" rx="27" fill="none" stroke="#1c2436" stroke-width="1"/>
  
  <text x="36" y="48" font-family="SF Pro Display, Helvetica Neue, Arial" font-size="22" font-weight="700" fill="#f5f8ff">visionOS HUD</text>
  <text x="36" y="74" font-family="SF Pro Text, Helvetica Neue, Arial" font-size="13" fill="#8ea0b8">Spatial panels, depth, look to pin</text>

  <rect x="520" y="88" width="140" height="90" rx="16" fill="#12182a" stroke="#0a84ff" opacity="0.95">
    <animate attributeName="opacity" values="0.7;1;0.7" dur="3s" repeatCount="indefinite"/>
  </rect>
  <rect x="640" y="108" width="140" height="90" rx="16" fill="#101624" stroke="#5e5ce6" opacity="0.75">
    <animate attributeName="y" values="108;98;108" dur="4s" repeatCount="indefinite"/>
  </rect>
  <text x="590" y="140" text-anchor="middle" font-family="SF Pro Display, Arial" font-size="14" fill="#f5f8ff">Panel A</text>
  <text x="710" y="160" text-anchor="middle" font-family="SF Pro Display, Arial" font-size="14" fill="#f5f8ff">Panel B</text>

</svg>
