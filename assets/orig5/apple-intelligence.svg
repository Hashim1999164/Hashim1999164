<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 240" width="840" height="240" role="img" aria-label="Apple Intelligence">
  <rect width="840" height="240" rx="28" fill="#070b14"/>
  <rect x="1" y="1" width="838" height="238" rx="27" fill="none" stroke="#1c2436"/>
  <text x="36" y="48" font-family="SF Pro Display, Helvetica Neue, Arial" font-size="22" font-weight="700" fill="#f5f8ff">Apple Intelligence</text>
  <text x="36" y="74" font-family="SF Pro Text, Helvetica Neue, Arial" font-size="13" fill="#8ea0b8">On-device model. Private by default.</text>
  <g transform="translate(640,70)">
    <ellipse cx="50" cy="70" rx="70" ry="50" fill="url(#g)" opacity="0.35"/>
    <defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0a84ff"/><stop offset="1" stop-color="#bf5af2"/></linearGradient></defs>
    <circle cx="50" cy="70" r="28" fill="#0a84ff" opacity="0.85">
      <animate attributeName="r" values="22;34;22" dur="2.4s" repeatCount="indefinite"/>
    </circle>
  </g>
