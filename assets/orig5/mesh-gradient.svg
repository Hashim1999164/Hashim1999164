<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 240" width="840" height="240" role="img" aria-label="MeshGradient">
  <rect width="840" height="240" rx="28" fill="#070b14"/>
  <rect x="1" y="1" width="838" height="238" rx="27" fill="none" stroke="#1c2436"/>
  <text x="36" y="48" font-family="SF Pro Display, Helvetica Neue, Arial" font-size="22" font-weight="700" fill="#f5f8ff">MeshGradient</text>
  <text x="36" y="74" font-family="SF Pro Text, Helvetica Neue, Arial" font-size="13" fill="#8ea0b8">SwiftUI color mesh.</text>
  <defs>
    <radialGradient id="m1"><stop stop-color="#0a84ff"/><stop offset="1" stop-color="#070b14" stop-opacity="0"/></radialGradient>
    <radialGradient id="m2"><stop stop-color="#bf5af2"/><stop offset="1" stop-color="#070b14" stop-opacity="0"/></radialGradient>
    <radialGradient id="m3"><stop stop-color="#30d158"/><stop offset="1" stop-color="#070b14" stop-opacity="0"/></radialGradient>
  </defs>
  <circle cx="620" cy="120" r="80" fill="url(#m1)">
    <animate attributeName="cx" values="620;700;620" dur="5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="740" cy="150" r="70" fill="url(#m2)">
    <animate attributeName="cy" values="150;110;150" dur="4s" repeatCount="indefinite"/>
  </circle>
  <circle cx="680" cy="100" r="50" fill="url(#m3)"/>
</svg>
