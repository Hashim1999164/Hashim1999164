<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 240" width="840" height="240" role="img" aria-label="Night mode">
  <rect width="840" height="240" rx="28" fill="#070b14"/>
  <rect x="1" y="1" width="838" height="238" rx="27" fill="none" stroke="#1c2436"/>
  <text x="36" y="48" font-family="SF Pro Display, Helvetica Neue, Arial" font-size="22" font-weight="700" fill="#f5f8ff">Night mode</text>
  <text x="36" y="74" font-family="SF Pro Text, Helvetica Neue, Arial" font-size="13" fill="#8ea0b8">Long exposure. Low light.</text>
  <circle cx="680" cy="130" r="50" fill="#0b1220" stroke="#ffd60a" stroke-width="3"/>
  <circle cx="698" cy="118" r="18" fill="#070b14"/>
  <text x="680" y="200" text-anchor="middle" fill="#ffd60a" font-size="12">3s</text>
  <circle cx="680" cy="130" r="56" fill="none" stroke="#ffd60a" opacity="0.4">
    <animate attributeName="opacity" values="0.15;0.7;0.15" dur="3s" repeatCount="indefinite"/>
  </circle>
</svg>
