<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 240" width="840" height="240" role="img" aria-label="PhaseAnimator">
  <rect width="840" height="240" rx="28" fill="#070b14"/>
  <rect x="1" y="1" width="838" height="238" rx="27" fill="none" stroke="#1c2436"/>
  <text x="36" y="48" font-family="SF Pro Display, Helvetica Neue, Arial" font-size="22" font-weight="700" fill="#f5f8ff">PhaseAnimator</text>
  <text x="36" y="74" font-family="SF Pro Text, Helvetica Neue, Arial" font-size="13" fill="#8ea0b8">SwiftUI phase. Bounce then settle.</text>
  <rect x="640" y="90" width="80" height="80" rx="18" fill="#0a84ff">
    <animate attributeName="y" values="90;70;90" dur="1.2s" repeatCount="indefinite"/>
    <animate attributeName="rx" values="18;40;18" dur="1.2s" repeatCount="indefinite"/>
  </rect>
</svg>
