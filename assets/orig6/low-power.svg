<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 240" width="840" height="240" role="img" aria-label="Low Power Mode">
  <rect width="840" height="240" rx="28" fill="#070b14"/>
  <rect x="1" y="1" width="838" height="238" rx="27" fill="none" stroke="#1c2436"/>
  <text x="36" y="48" font-family="SF Pro Display, Helvetica Neue, Arial" font-size="22" font-weight="700" fill="#f5f8ff">Low Power Mode</text>
  <text x="36" y="74" font-family="SF Pro Text, Helvetica Neue, Arial" font-size="13" fill="#8ea0b8">Yellow battery. Fewer wakes.</text>
  <rect x="600" y="110" width="160" height="50" rx="10" fill="none" stroke="#ffd60a" stroke-width="4"/>
  <rect x="608" y="118" width="70" height="34" rx="6" fill="#ffd60a">
    <animate attributeName="width" values="50;90;50" dur="2.4s" repeatCount="indefinite"/>
  </rect>
</svg>