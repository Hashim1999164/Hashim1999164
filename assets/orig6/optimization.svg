<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 240" width="840" height="240" role="img" aria-label="Background App Refresh">
  <rect width="840" height="240" rx="28" fill="#070b14"/>
  <rect x="1" y="1" width="838" height="238" rx="27" fill="none" stroke="#1c2436"/>
  <text x="36" y="48" font-family="SF Pro Display, Helvetica Neue, Arial" font-size="22" font-weight="700" fill="#f5f8ff">Background Refresh</text>
  <text x="36" y="74" font-family="SF Pro Text, Helvetica Neue, Arial" font-size="13" fill="#8ea0b8">Wake, fetch, sleep.</text>
  <g transform="translate(620,100)">
    <circle cx="60" cy="40" r="28" fill="none" stroke="#1c2436" stroke-width="8"/>
    <circle cx="60" cy="40" r="28" fill="none" stroke="#0a84ff" stroke-width="8" stroke-dasharray="40 140">
      <animateTransform attributeName="transform" type="rotate" from="0 60 40" to="360 60 40" dur="2s" repeatCount="indefinite"/>
    </circle>
  </g>
